# The tool's own tests, on a GitHub-hosted machine: the manifest check, then every test file the manifest lists, with
# no KiCad and no Mac (the KiCad cases skip unless BOARD_GRAPH_TEST_KICAD=1, which is not set here). Python 3.9 is
# the KiCad machine's; the semantic snapshot's audit parses 3.10 syntax, so it runs on the newer Python only.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Python 3.9 has no build for the newest Ubuntu image, so it runs on an older one.
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: The manifest
        run: python scripts/board_graph_tool.py check

      - name: The upgrade notes
        run: python scripts/board_graph_tool.py notes

      - name: Workflow acceptance on disposable projects
        run: python .github/scripts/audit_workflow.py .

      - name: Script hygiene guardrails
        run: python .github/scripts/check_hygiene.py

      - name: Dev workflow tests
        run: python dev/test_tool_dev.py

      - name: Wheel install smoke
        run: |
          python -m venv /tmp/bg-wheel-smoke
          /tmp/bg-wheel-smoke/bin/pip install --quiet .
          mkdir -p /tmp/bg-wheel-proj
          /tmp/bg-wheel-smoke/bin/board-graph version
          /tmp/bg-wheel-smoke/bin/board-graph --project /tmp/bg-wheel-proj init
          /tmp/bg-wheel-smoke/bin/board-graph --project /tmp/bg-wheel-proj board-description
          /tmp/bg-wheel-smoke/bin/board-graph --project /tmp/bg-wheel-proj check

      - name: The tool's tests
        run: |
          python - <<'PY'
          import concurrent.futures, json, os, subprocess, sys, threading, time
          manifest = json.load(open("tools/board_graph_tool.json", encoding="utf-8"))
          tests = [
              f for f in manifest["files"]
              if f.rsplit("/", 1)[-1].startswith("test_") and f.endswith(".py")
          ]
          if sys.version_info < (3, 10):
              skipped = "tools/kicad/test_kicad_semantic_snapshot.py"
              if skipped in tests:
                  print(f"{skipped}: not run, it needs Python 3.10 or newer", flush=True)
                  tests = [t for t in tests if t != skipped]
          stop = threading.Event()
          lock = threading.Lock()
          active = set()
          def run_one(test):
              if stop.is_set():
                  return test, None, "", 0.0
              t0 = time.monotonic()
              proc = subprocess.Popen([sys.executable, test], stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              with lock:
                  active.add(proc)
              try:
                  out, err = proc.communicate()
              finally:
                  with lock:
                      active.discard(proc)
              return test, proc.returncode, (out or "") + (err or ""), time.monotonic() - t0
          failed = []
          workers = min(4, max(1, os.cpu_count() or 2))
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as pool:
              futs = {pool.submit(run_one, t): t for t in tests}
              for fut in concurrent.futures.as_completed(futs):
                  test, rc, text, sec = fut.result()
                  if rc is None:
                      continue
                  if stop.is_set() and rc != 0:
                      continue
                  if rc == 0:
                      print(f"ok   {test} ({sec:.1f}s)", flush=True)
                  else:
                      print(f"::group::FAIL {test} ({sec:.1f}s)", flush=True)
                      print(text, flush=True)
                      print("::endgroup::", flush=True)
                      failed.append(test)
                      stop.set()
                      for p in futs:
                          p.cancel()
                      with lock:
                          for proc in list(active):
                              if proc.poll() is None:
                                  proc.terminate()
          if failed:
              sys.exit(1)
          PY
