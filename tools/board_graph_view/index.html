<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph</title>
<style>
  :root {
    color-scheme: dark;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    --field: #000000;
    --ink-1: #f0efec;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --hair: rgba(255, 255, 255, 0.10);
    --panel: rgba(10, 10, 10, 0.94);
    --control: rgba(22, 22, 21, 0.88);
    --control-hover: rgba(44, 44, 42, 0.92);
    --focus: #86b6ef;
    --panel-w: min(460px, 100vw);
    --strip-h: 36px;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    /* Workspace and log state: quiet when nothing needs doing, amber when something waits, red when it failed. */
    --ok: #898781;
    --warn: #f2c14e;
    --bad: #f27a6b;
    --good: #3987e5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--field); color: var(--ink-1); overflow: hidden; }
  body { font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; cursor: grab; }
  #scene:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  #scene.pointing { cursor: pointer; }
  #scene.dragging { cursor: grabbing; }

  .hud { position: fixed; top: 20px; left: 24px; width: min(352px, calc(100vw - 48px)); pointer-events: none; z-index: 2; }
  .hud > * { pointer-events: auto; position: relative; }
  .hud::before {
    /* A soft shade behind the text, so it stays readable when the scene passes under it. */
    content: ""; position: absolute; inset: -40px -90px -40px -60px; pointer-events: none;
    background: radial-gradient(closest-side, rgba(0, 0, 0, 0.84), rgba(0, 0, 0, 0.62) 60%, rgba(0, 0, 0, 0));
  }
  .hud h1 { font: 600 22px/1.2 var(--font-display); letter-spacing: -0.01em; margin: 0 0 2px; }
  .hud .milestone { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; }
  .needs-you { margin: 0 0 14px; display: grid; gap: 6px; }
  .needs-you[hidden] { display: none; }
  .needs-item {
    all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%;
    padding: 8px 11px; border-radius: 7px; border: 1px solid rgba(242, 193, 78, 0.45);
    background: rgba(242, 193, 78, 0.09); color: var(--ink-1); font-size: 13px; line-height: 1.4;
  }
  .needs-item:hover { background: rgba(242, 193, 78, 0.16); border-color: rgba(242, 193, 78, 0.72); }
  .needs-item:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .needs-head { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--warn); font-size: 12.5px; }
  .needs-sub { color: var(--ink-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* Several boards: one row per board, the one shown marked; a row opens that board's graph. */
  .boards { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 3px; }
  .boards[hidden] { display: none; }
  .boards a { all: unset; cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 4px 9px; border-left: 2px solid rgba(255, 255, 255, 0.16); border-radius: 0 5px 5px 0;
    color: var(--ink-2); font-size: 13px; line-height: 1.35; }
  .boards a:hover { background: rgba(255, 255, 255, 0.05); color: var(--ink-1); }
  .boards a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
  .boards a[aria-current] { border-left-color: var(--good); background: rgba(57, 135, 229, 0.11); color: var(--ink-1); }
  .boards a.needs-owner { border-left-color: var(--warn); }
  .boards .name { font-weight: 600; white-space: nowrap; }
  .boards .at { color: var(--ink-3); font-size: 12.5px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .boards a[aria-current] .at { color: var(--ink-2); }
  .boards a.needs-owner .at { color: var(--warn); font-weight: 500; }
  .positions { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  /* The tabs: one per track with cards. The board's is the whole graph; another track's is that track's own page. */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 14px; }
  .tabs[hidden] { display: none; }
  .tabs a { all: unset; cursor: pointer; padding: 3px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--ink-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
  .tabs a:hover { background: rgba(255, 255, 255, 0.06); color: var(--ink-1); }
  .tabs a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tabs a[aria-current] { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.34); color: var(--ink-1); }
  .positions button {
    all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px 1fr; column-gap: 10px;
    cursor: pointer; border-radius: 6px; padding: 2px 6px 2px 0; width: 100%;
  }
  .positions button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .positions .swatch { width: 10px; height: 10px; border-radius: 2px; margin-top: 6px; }
  .positions .track { color: var(--ink-3); font-size: 12px; line-height: 1.3; }
  .positions .node { font-weight: 600; font-size: 15px; line-height: 1.35; }
  .positions button:hover .node { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-3); }
  .positions .detail { color: var(--ink-2); font-size: 12px; line-height: 1.4; }
  .positions .launch-status { color: var(--warn); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
  .stamp { margin: 14px 0 0; color: var(--ink-3); font-size: 12px; }
  #live { margin-top: 4px; }
  #live.off { color: #e0a040; }

  /* A card's part of the graph's running notes, in its panel: the notes file's own words, as they stand now. */
  .notes-text { margin-top: 6px; padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere;
    color: var(--ink-1); font-size: 13.5px; line-height: 1.5; background: rgba(255, 255, 255, 0.04); border-left: 2px solid var(--ink-3); border-radius: 2px; }
  .notes-text.empty { color: var(--ink-3); }

  /* The log: what ran and what was recorded, newest first. */
  .log { margin: 22px 0 0; }
  .log-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 4px; }
  .log-head h2 { font: 600 13px/1.3 var(--font); color: var(--ink-2); margin: 0; }
  .log-head .link { font-size: 12px; font-weight: 500; color: var(--ink-2); }
  .log-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .row {
    all: unset; box-sizing: border-box; display: grid; grid-template-columns: 40px 9px minmax(0, 1fr); column-gap: 8px;
    width: 100%; padding: 4px 6px 4px 0; border-radius: 6px; cursor: pointer;
  }
  .row:hover .row-title { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--ink-3); }
  .row:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .row-time { color: var(--ink-3); font-size: 12px; line-height: 1.35; font-variant-numeric: tabular-nums; }
  .row-time span { display: block; color: #6b6a65; }
  .row .dot { margin-top: 6px; }
  .row-title, .row-sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-title { font-size: 13.5px; line-height: 1.35; font-weight: 500; }
  .row-sub { font-size: 12px; line-height: 1.35; color: var(--ink-3); }
  .panel .row-title, .panel .row-sub { white-space: normal; }
  .panel .log-rows { margin-top: 10px; gap: 4px; }
  .empty { color: var(--ink-3); font-size: 13px; margin: 0; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; box-shadow: inset 0 0 0 1.5px var(--ok); }
  .dot.good { background: var(--good); box-shadow: none; }
  .dot.warn { background: var(--warn); box-shadow: none; }
  .dot.bad { background: var(--bad); box-shadow: none; }

  /* The workspace strip: git beside the graph, as information. */
  .strip {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--strip-h); display: flex; align-items: stretch;
    background: rgba(8, 8, 8, 0.97); border-top: 1px solid var(--hair); font-size: 12.5px;
    overflow-x: auto; overflow-y: hidden; scrollbar-width: none; transition: right 220ms ease;
  }
  .strip::-webkit-scrollbar { display: none; }
  /* More chips past the right edge: the strip fades there and scrolls sideways. */
  .strip.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent);
    mask-image: linear-gradient(to right, #000 calc(100% - 56px), transparent); }
  body.panel-open .strip { right: var(--panel-w); }
  .strip-title { display: flex; align-items: center; padding: 0 14px 0 24px; color: var(--ink-3); white-space: nowrap; flex: none; }
  .chip {
    all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; flex: none;
    border-left: 1px solid var(--hair); white-space: nowrap; cursor: pointer; color: var(--ink-2);
  }
  .chip:hover { background: var(--control-hover); color: var(--ink-1); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .chip .k { color: var(--ink-3); }
  .chip b { font-weight: 600; color: var(--ink-1); }
  .strip-title .asof { margin-left: 6px; }

  /* Watching a change: a new log row slides in at the top; a changed row, strip cell or position flashes once.
     The flashes only change colour, so they play under reduced motion too; the slide does not (rowItem). */
  @keyframes row-in {
    from { opacity: 0; transform: translateY(-10px); max-height: 0; }
    to { opacity: 1; transform: none; max-height: 80px; }
  }
  @keyframes lit { from { background-color: rgba(134, 182, 239, 0.34); } to { background-color: rgba(134, 182, 239, 0); } }
  .log-rows li.enter { animation: row-in 600ms cubic-bezier(0.2, 0.7, 0.2, 1) backwards; overflow: hidden; }
  .log-rows li.enter .row, .log-rows li.changed .row { animation: lit 1600ms ease-out; }
  .chip.flash { animation: lit 1400ms ease-out; }
  .positions li.flash .node { animation: lit 1400ms ease-out; border-radius: 4px; }
  .mono { font-family: var(--mono); font-size: 0.92em; }

  .facts { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 12px; margin: 4px 0 0; font-size: 14px; }
  .facts dt { color: var(--ink-3); }
  .facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .said {
    font: 12px/1.5 var(--mono); color: var(--ink-2); background: rgba(255, 255, 255, 0.03); border: 1px solid var(--hair);
    border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 6px 0 0; max-height: 360px; overflow: auto;
  }
  .bullets { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; }
  .block { border-top: 1px solid var(--hair); padding: 10px 0 2px; margin-top: 10px; }
  .block:first-of-type { border-top: 0; margin-top: 0; padding-top: 2px; }
  .back { display: inline-block; margin: 0 0 12px; font-weight: 500; }
  a.link { all: unset; cursor: pointer; color: var(--ink-1); font-weight: 600; text-decoration: underline;
    text-decoration-color: rgba(240, 239, 236, 0.35); text-underline-offset: 3px; overflow-wrap: anywhere; }
  a.link:hover { text-decoration-color: var(--ink-1); }
  a.link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

  .toolbar { position: fixed; top: 20px; right: 24px; display: flex; gap: 8px; transition: right 220ms ease; z-index: 3; }
  body.panel-open .toolbar { right: calc(var(--panel-w) + 16px); }
  .tool {
    font: 500 13px/1 var(--font); color: var(--ink-1); background: var(--control);
    border: 1px solid var(--hair); border-radius: 6px; padding: 9px 13px; cursor: pointer;
  }
  .tool:hover { background: var(--control-hover); }
  .tool[aria-pressed="true"] { border-color: rgba(134, 182, 239, 0.6); }

  .legend {
    position: fixed; left: 24px; bottom: calc(var(--strip-h) + 12px); right: 24px; display: flex; flex-wrap: wrap; align-items: center;
    gap: 6px 18px; color: var(--ink-2); font-size: 12px; pointer-events: none;
  }
  body.panel-open .legend { right: calc(var(--panel-w) + 16px); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .legend svg { flex: none; }
  .legend .hint { color: var(--ink-3); margin-left: auto; }

  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); background: #0b0b0b;
    border-left: 1px solid var(--hair); transform: translateX(100%); transition: transform 220ms ease;
    overflow-y: auto; padding: 22px 28px 40px; visibility: hidden; z-index: 5;
  }
  .panel.open { transform: none; visibility: visible; }
  .panel-close { float: right; margin: -2px -6px 0 12px; }
  .panel .where { color: var(--ink-3); font-size: 13px; margin: 2px 0 6px; }
  .panel h2 { font: 600 28px/1.15 var(--font-display); letter-spacing: -0.015em; margin: 0 0 12px; clear: none; }
  .panel h3 { font: 600 13px/1.3 var(--font); color: var(--ink-2); margin: 20px 0 7px; }
  .panel p { margin: 0 0 8px; max-width: 62ch; }
  .panel .quiet { color: var(--ink-2); font-size: 13.5px; }
  .state-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-1);
    border: 1px solid var(--hair); border-radius: 999px; padding: 3px 11px 3px 8px; }
  .state i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .who-pill { font-size: 12.5px; color: var(--ink-3); padding: 2px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.04); }
  .who-pill.you { color: var(--warn); background: rgba(242, 193, 78, 0.11); font-weight: 600; }
  .callout { margin: 12px 0 4px; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--hair); background: rgba(255, 255, 255, 0.03); }
  .callout.owner { border-color: rgba(242, 193, 78, 0.45); background: rgba(242, 193, 78, 0.08); }
  .callout.work { border-color: rgba(57, 135, 229, 0.45); background: rgba(57, 135, 229, 0.09); }
  .callout-head { font-weight: 600; font-size: 13.5px; margin: 0 0 4px; color: var(--ink-1); }
  .callout.owner .callout-head { color: var(--warn); }
  .artifact-primary {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; margin: 12px 0 8px;
    padding: 11px 14px; border-radius: 8px; border: 1px solid rgba(134, 182, 239, 0.42);
    background: rgba(57, 135, 229, 0.15); color: var(--ink-1); text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .artifact-primary:hover { background: rgba(57, 135, 229, 0.25); border-color: rgba(134, 182, 239, 0.72); }
  .artifact-primary .kind { font-weight: 500; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .artifact-list { list-style: none; margin: 6px 0 0; padding: 0; border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
  .artifact-list li + li { border-top: 1px solid var(--hair); }
  .artifact-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px;
    padding: 9px 12px; color: var(--ink-1); text-decoration: none; background: rgba(255, 255, 255, 0.025); font-size: 13.5px;
  }
  a.artifact-row:hover { background: rgba(255, 255, 255, 0.07); }
  .artifact-row.missing { color: var(--ink-3); background: transparent; }
  .artifact-main { min-width: 0; }
  .artifact-title { font-weight: 500; overflow-wrap: anywhere; }
  .artifact-path { font: 11.5px/1.35 var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
  .artifact-meta { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .artifact-row.missing .artifact-meta { color: var(--ink-3); }
  .mini-table-wrap { margin: 8px 0 0; border: 1px solid var(--hair); border-radius: 8px; overflow-x: auto; max-height: 280px; overflow-y: auto; }
  .mini-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .mini-table th, .mini-table td { padding: 6px 9px; text-align: left; border-bottom: 1px solid rgba(255, 255, 255, 0.07); vertical-align: top; }
  .mini-table th { position: sticky; top: 0; background: #141413; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
  .mini-table tr:last-child td { border-bottom: 0; }
  .outcomes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .outcomes li { display: grid; grid-template-columns: 76px 1fr; gap: 10px; font-size: 14px; }
  .outcomes .key { color: var(--ink-3); }
  .link {
    all: unset; cursor: pointer; color: var(--ink-1); font-weight: 600;
    text-decoration: underline; text-decoration-color: rgba(240, 239, 236, 0.35); text-underline-offset: 3px;
  }
  .link:hover { text-decoration-color: var(--ink-1); }
  .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
  .note { border-left: 2px solid var(--hair); padding: 2px 0 2px 12px; color: var(--ink-2); font-size: 14px; margin: 6px 0 0; }
  details { border-top: 1px solid var(--hair); padding: 9px 0; font-size: 14px; }
  details:last-child { border-bottom: 1px solid var(--hair); }
  details.machine-details { margin-top: 22px; }
  details.machine-details > summary { color: var(--ink-3); font-weight: 500; font-size: 13px; }
  details.machine-details[open] > summary { color: var(--ink-2); margin-bottom: 8px; }
  summary { cursor: pointer; font-weight: 600; }
  details p { color: var(--ink-2); margin: 6px 0 0; font-size: 13px; }
  .filter-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0 10px; }

  .list-track { margin: 18px 0 4px; font: 600 15px/1.3 var(--font); }
  .list-stage { margin: 12px 0 4px; color: var(--ink-3); font-size: 13px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
  .list .word { color: var(--ink-3); font-size: 13px; white-space: nowrap; }

  .message { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-2); }
  .message[hidden] { display: none; }
  .message strong { display: block; color: var(--ink-1); font: 600 18px/1.3 var(--font-display); margin-bottom: 6px; }

  /* The log under the positions gives way first when the window is short: fitLog() leaves out the rows that would
     reach the legend. */
  .hud .log[hidden], .hud .log-rows li[hidden] { display: none; }
  @media (max-width: 720px) {
    .hud { top: 12px; left: 16px; }
    .hud h1 { font-size: 18px; }
    .hud .milestone { margin-bottom: 10px; }
    .positions .detail, .stamp, .hud .log { display: none; }
    .toolbar { top: auto; bottom: calc(var(--strip-h) + 12px); right: 16px; left: 16px; justify-content: flex-end; flex-wrap: wrap; }
    body.panel-open .toolbar { right: 16px; }
    body.panel-open .strip { right: 0; }
    .strip-title { padding-left: 16px; }
    .legend { display: none; }
    .panel { padding: 18px 18px 32px; }
    .facts { grid-template-columns: 96px minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel, .toolbar, .strip { transition: none; }
  }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="The graph in 3D. Use the track positions at the top left or All nodes for a list."></canvas>

<header class="hud">
  <h1 id="title">Graph</h1>
  <p class="milestone" id="milestone"></p>
  <nav class="tabs" id="tabs" aria-label="Tracks" hidden></nav>
  <div class="needs-you" id="needs-you" aria-label="Needs your input" hidden></div>
  <ul class="boards" id="boards" aria-label="Graphs" hidden></ul>
  <ul class="positions" id="positions"></ul>
  <p class="stamp" id="stamp"></p>
  <p class="stamp" id="live" hidden></p>
  <section class="log" id="log" aria-label="Recent updates">
    <div class="log-head"><h2>Recent updates</h2><button class="link" id="log-all" type="button">All</button></div>
    <ol class="log-rows" id="log-rows"></ol>
  </section>
</header>

<nav class="toolbar" aria-label="View">
  <button class="tool" id="reset" type="button">Reset view</button>
  <button class="tool" id="list" type="button" aria-pressed="false">All nodes</button>
  <button class="tool" id="log-open" type="button" aria-pressed="false">Log</button>
  <button class="tool" id="private" type="button" aria-pressed="false" title="Draw the page from a copy of the snapshot with the private details taken out: machine and account names, local paths, commit hashes, links and the workspace block. Nothing is covered; they are not in the page while this is on.">Hide private</button>
  <button class="tool" id="save" type="button">Save PNG</button>
</nav>

<footer class="legend" id="legend" aria-hidden="true">
  <span><svg width="22" height="12"><rect x="1" y="1" width="20" height="10" rx="3" fill="#1c5cab" stroke="#3987e5"/></svg>Passed</span>
  <span><svg width="22" height="12"><rect x="1" y="1" width="20" height="10" rx="3" fill="#86b6ef" stroke="#cde2fb"/></svg>On it</span>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js';

// ---------------------------------------------------------------- palette and type
// Track identity: the dataviz skill's categorical slots 1 to 3, dark steps (validated all-pairs on black).
// State is light: one hue per track, stepped from dim (ahead) to lit (passed) to bright (here now).
// The board's steps are its documented blue ramp (650, 550, 400, 250, 100); the side tracks mix their
// slot hue toward black or white in the same proportions. The board is blue; the other tracks in order take the
// slots in the graph's order (setHues), and a list (a track out of order) is grey.
const SLOTS = ['#d95926', '#199e70', '#b8891f'], LIST_HUE = '#898781';
const HUE = { board: '#3987e5' }, LISTS = new Set();
// A page per track: ?track=<id> names a track with cards, and the page shows that track alone, its cards the main
// path in rows of ROW. MAIN is the track the page shows that way: the board's unless ?track names another.
const TRACK = new URLSearchParams(location.search).get('track'), ROW = 4;
let MAIN = 'board';
// The track whose cards are grouped in stages and drawn as terraces: the board's, else the track of the first card
// that names a stage. With neither it stays 'board', a track the graph does not have.
let STAGED = 'board';
const trackHead = t => t.label.split(' (')[0];
// A track's page, as a link: the board's has no ?track; ?board (which board, with several) is kept.
function trackHref(id) {
  const q = new URLSearchParams(location.search);
  if (id === STAGED) q.delete('track'); else q.set('track', id);
  const text = q.toString();
  return location.pathname + (text ? '?' + text : '');
}
// The graph a track's page draws: that track alone, its cards in rows of ROW standing where the board's stages
// stand. What a card requires or returns to on another track is not drawn; `elsewhere` keeps what it requires
// there, for the card's panel.
function trackGraph(g, id) {
  const own = g.nodes.filter(n => n.track === id), ids = new Set(own.map(n => n.id));
  const stages = [];
  for (let i = 0; i < own.length; i += ROW) {
    const last = Math.min(i + ROW, own.length);
    stages.push({ id: `row-${i / ROW + 1}`, row: true, label: last - i > 1 ? `Cards ${i + 1} to ${last}` : `Card ${last}` });
  }
  const nodes = own.map((n, i) => ({ ...n, stage: stages[Math.floor(i / ROW)].id,
    requires: (n.requires || []).filter(r => ids.has(r)), elsewhere: (n.requires || []).filter(r => !ids.has(r)),
    outcomes: { ...n.outcomes, returned: n.outcomes.returned.filter(r => ids.has(r)) } }));
  return { ...g, tracks: g.tracks.filter(t => t.id === id), stages, nodes };
}
function setHues(tracks) {
  for (const id of Object.keys(HUE)) if (id !== 'board') delete HUE[id];
  LISTS.clear();

  if (STAGED !== 'board') HUE[STAGED] = HUE.board;
  for (const t of tracks) {
    if (t.id === STAGED) continue;
    if (t.ordered) HUE[t.id] = SLOTS[slot++ % SLOTS.length];
    else { HUE[t.id] = LIST_HUE; LISTS.add(t.id); }
  }
}
const INK = { primary: '#f0efec', secondary: '#c3c2b7', muted: '#898781', faint: '#6b6a65', dark: '#0b0b0b' };
const FONT = getComputedStyle(document.documentElement).getPropertyValue('--font').trim();
const FONT_DISPLAY = getComputedStyle(document.documentElement).getPropertyValue('--font-display').trim();
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  return '#' + [16, 8, 0].map(s => {
    const x = (pa >> s) & 255, y = (pb >> s) & 255;
    return Math.round(x + (y - x) * t).toString(16).padStart(2, '0');
  }).join('');
}
function steps(track) {
  if (track === STAGED) {
    return { dim: '#2a4f7f', lit: '#1c5cab', glow: '#3987e5', bright: '#86b6ef', next: '#cde2fb', floor: '#06101c', floorLit: '#091a2e' };
  }
  if (LISTS.has(track) || !HUE[track]) {
    return { dim: '#3a3a37', lit: '#52514e', glow: '#898781', bright: '#c3c2b7', next: '#e1e0d9', floor: '#0a0a0a', floorLit: '#0d0d0d' };
  }
  const h = HUE[track];
  return { dim: mixHex(h, '#000000', 0.42), lit: mixHex(h, '#000000', 0.32), glow: h, bright: mixHex(h, '#ffffff', 0.42),
           next: mixHex(h, '#ffffff', 0.72), floor: mixHex(h, '#000000', 0.93), floorLit: mixHex(h, '#000000', 0.88) };
}

// ---------------------------------------------------------------- geometry constants
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const LEAN = THREE.MathUtils.degToRad(50);          // cards lean back from upright, like a music stand
const UP = V(0, Math.cos(LEAN), -Math.sin(LEAN));    // a card's own up, in the world
const NORMAL = V(0, Math.sin(LEAN), Math.cos(LEAN)); // the way a card faces
const CARD = { w: 3.4, h: 1.5 };
const LANE = { depth: 3.6, rise: 1.15 };             // lanes climb in terraces: stage 1 nearest, stage 7 highest
const COL = 4.75, X0 = -5.6, SIDE_X = 15.4;          // the gap between cards is long enough to see light flow in it
const STAGE_LABEL_W = 7.4;
const LANE_LEFT = X0 - CARD.w / 2 - 0.45 - STAGE_LABEL_W - 0.35, LANE_RIGHT = X0 + 3 * COL + CARD.w / 2 + 1.0;
const TEX = { w: 1024, h: Math.round(1024 * CARD.h / CARD.w) };

const laneBase = i => V(0, i * LANE.rise, -i * LANE.depth);

// Where each track but the board's sits, read from the graph alone. A track in order sits beside the stage its
// label names in its parenthesis (the last one named: "beside Layout and Package" sits by Package), else beside the
// earliest stage with a board card that requires one of its cards or returns work to one, else beside the first
// stage no other track holds. A list (a track out of order) sits apart, below the second stage. Tracks on one row
// sit one after another, in the graph's order. A track with no cards gets no row.
function sideLanes(g) {
  const words = text => (text || '').toLowerCase().match(/[a-z0-9]+/g) || [];
  const stageKeys = g.stages.map(s => new Set([s.id.toLowerCase(), words(s.label)[0]].filter(Boolean)));
  const trackOf = new Map(g.nodes.map(n => [n.id, n.track]));
  const named = t => {
    const cut = t.label.indexOf('(');
    let found = -1;
    if (cut >= 0) for (const w of words(t.label.slice(cut))) {
      const i = stageKeys.findIndex(keys => keys.has(w));
      if (i >= 0) found = i;
    }
    return found;
  };
  const linked = t => {
    const stages = g.nodes.filter(n => n.track === MAIN && [...(n.requires || []), ...(n.outcomes?.returned || [])]
      .some(id => trackOf.get(id) === t.id)).map(n => g.stages.findIndex(s => s.id === n.stage)).filter(i => i >= 0);
    return stages.length ? Math.min(...stages) : -1;
  };
  const rows = new Map(), lanes = [], held = new Set();
  const tracks = g.tracks.filter(t => t.id !== MAIN && g.nodes.some(n => n.track === t.id));
  const chosen = new Map();
  for (const t of tracks.filter(t => t.ordered)) {
    const i = [named(t), linked(t)].find(x => x >= 0);
    if (i !== undefined) { chosen.set(t.id, i); held.add(i); }
  }
  for (const t of tracks.filter(t => t.ordered && !chosen.has(t.id))) {
    let i = g.stages.findIndex((s, k) => !held.has(k));
    if (i < 0) i = 0;
    chosen.set(t.id, i); held.add(i);
  }
  for (const t of tracks) {
    const list = !t.ordered;
    const key = list ? 'list' : chosen.get(t.id);
    const pitch = list ? 3.75 : COL, scale = list ? 0.8 : 1, tail = list ? 0.7 : 2.2;
    const ids = g.nodes.filter(n => n.track === t.id).map(n => n.id);
    // The row's next free x: right of the last track on it, with the same gap a row leaves before the board.
    const x = rows.has(key) ? rows.get(key) : list ? SIDE_X - 0.5 : SIDE_X;
    const lane = list ? laneBase(Math.min(1, g.stages.length - 1)).add(V(0, -0.7, 0.2)) : laneBase(key);
    lanes.push({ track: t.id, ids, lane, x, pitch, scale, tail, list });
    rows.set(key, x + (ids.length - 1) * pitch + CARD.w * scale + tail + 0.7 + 1.6);
  }
  return lanes;
}

// ---------------------------------------------------------------- canvas textures
let maxAniso = 1;
function texture(canvas) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function rr(g, x, y, w, h, r) {
  g.beginPath();
  if (g.roundRect) { g.roundRect(x, y, w, h, r); return; }
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function wrap(g, text, maxW) {
  const lines = []; let line = '';
  for (const word of text.split(' ')) {
    const next = line ? line + ' ' + word : word;
    if (!line || g.measureText(next).width <= maxW) line = next; else { lines.push(line); line = word; }
  }
  if (line) lines.push(line);
  return lines;
}
function fitLabel(g, text, maxW) {
  for (const size of [98, 92, 86]) {
    g.font = `600 ${size}px ${FONT_DISPLAY}`;
    if (g.measureText(text).width <= maxW) return { size, lines: [text] };
  }
  for (const size of [80, 74, 68, 62, 54]) {
    g.font = `600 ${size}px ${FONT_DISPLAY}`;
    const lines = wrap(g, text, maxW);
    if (lines.length <= 2 && lines.every(l => g.measureText(l).width <= maxW)) return { size, lines };
  }
  g.font = `600 54px ${FONT_DISPLAY}`;
  return { size: 54, lines: wrap(g, text, maxW).slice(0, 2) };
}

// Every time on the page is the viewer's own local time, never UTC: the date as 11/16 (the year only when it is not
// this year) and the time as 4:14p.
const localClock = d => `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}${d.getHours() < 12 ? 'a' : 'p'}`;
const localDay = d => `${d.getMonth() + 1}/${d.getDate()}${d.getFullYear() === new Date().getFullYear() ? '' : '/' + String(d.getFullYear()).slice(2)}`;
// When an open attempt started, short: the time today, else the date and the time.
function sinceText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  return d.toDateString() === new Date().toDateString() ? localClock(d) : `${localDay(d)} ${localClock(d)}`;
}
// How long ago, in where's words (board_graph.py's ago).
function agoText(iso) {
  const m = (Date.now() - new Date(iso)) / 60000;
  if (isNaN(m)) return 'when, it does not say';
  if (m < 1) return 'under a minute ago';
  if (m < 120) return `${Math.round(m)} min ago`;
  return m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`;
}
const workLine = a => `working: ${a.by}, since ${sinceText(a.since)}`;

const WHO = { auto: 'auto check', agent: 'agent', owner: 'you', owner_and_agent: 'you + agent' };

function cardLook(node, track, M) {
  const S = steps(track);
  const done = M.tracks[track]?.done;
  if (node.status === 'current') return { fill: S.bright, border: S.next, label: INK.dark, foot: '#1d1c19', S };
  if (node.status === 'passed' && done) return { fill: mixHex(S.lit, '#000000', 0.35), border: S.lit, label: INK.secondary, foot: INK.muted, S };
  if (node.status === 'passed') return { fill: S.lit, border: S.glow, label: INK.primary, foot: INK.secondary, S };
  return { fill: '#0b0b0b', border: S.dim, label: '#a3a29b', foot: '#8f8e88', S };
}

function cardCanvas(node, look, tag, issues, work, badge) {
  const c = document.createElement('canvas'); c.width = TEX.w; c.height = TEX.h;
  const g = c.getContext('2d');
  const pad = 50;
  rr(g, 5, 5, TEX.w - 10, TEX.h - 10, 40);
  g.fillStyle = look.fill; g.fill();
  g.lineWidth = 7; g.strokeStyle = look.border; g.stroke();

  const { size, lines } = fitLabel(g, node.label, TEX.w - pad * 2);
  g.fillStyle = look.label; g.textBaseline = 'alphabetic';
  if (lines.length === 1) g.fillText(lines[0], pad, 66 + size * 0.86);
  else lines.forEach((l, i) => g.fillText(l, pad, 50 + size * 0.86 + i * size * 1.08));

  const footY = TEX.h - 52;
  if (work) {
    // Who is working the node and since when, between the label and the foot.
    let text = workLine(work), px = 58;
    const room = TEX.w - pad * 2;
    g.font = `600 ${px}px ${FONT}`;
    while (g.measureText(text).width > room && px > 42) { px -= 4; g.font = `600 ${px}px ${FONT}`; }
    while (g.measureText(text).width > room && text.length > 4) text = text.slice(0, -2) + '…';
    g.fillStyle = look.label;
    g.fillText(text, pad, footY - 104);
  }
  const isYou = node.who === 'owner' || node.who === 'owner_and_agent';
  g.font = `${isYou ? 600 : 500} 64px ${FONT}`;
  g.fillStyle = isYou && node.status !== 'current' ? '#f2c14e' : look.foot;
  g.fillText(WHO[node.who] || node.who, pad, footY);

  if (tag) {
    g.font = `600 60px ${FONT}`;
    const tw = g.measureText(tag.text).width, ph = 90, pw = tw + 60, px = TEX.w - pad + 18 - pw, py = footY - 66;
    rr(g, px, py, pw, ph, ph / 2);
    if (tag.solid) { g.fillStyle = tag.fill; g.fill(); g.fillStyle = tag.ink; }
    else { g.lineWidth = 6; g.strokeStyle = tag.fill; g.stroke(); g.fillStyle = tag.fill; }
    g.fillText(tag.text, px + 30, footY);
  } else if (issues) {
    g.font = `500 58px ${FONT}`; g.fillStyle = look.foot; g.textAlign = 'right';
    g.fillText(issues === 1 ? '1 open question' : `${issues} open questions`, TEX.w - pad, footY);
    g.textAlign = 'left';
  } else if (badge) {
    g.font = `500 58px ${FONT}`; g.fillStyle = node.status === 'passed' ? look.label : '#b8b6ad'; g.textAlign = 'right';
    g.fillText(badge, TEX.w - pad, footY);
    g.textAlign = 'left';
  }
  return c;
}

function textCanvas(parts, w, h, pxPerUnit, opts = {}) {
  const c = document.createElement('canvas');
  c.width = Math.round(w * pxPerUnit); c.height = Math.round(h * pxPerUnit);
  const g = c.getContext('2d');
  let x = opts.x || 0;
  const base = opts.baseline ?? c.height * 0.72;
  for (const p of parts) {
    g.font = `${p.weight || 600} ${p.size}px ${p.display ? FONT_DISPLAY : FONT}`;
    g.fillStyle = p.color;
    g.fillText(p.text, x, base + (p.dy || 0));
    x += g.measureText(p.text).width + (p.gap ?? 0);
  }
  return c;
}

function glowCanvas(kind) {
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  if (kind === 'halo') {
    c.width = 640; c.height = 320;
    g.filter = 'blur(34px)'; g.fillStyle = '#ffffff';
    rr(g, 110, 100, 420, 120, 34); g.fill();
  } else if (kind === 'ring') {
    c.width = 1024; c.height = 420;
    g.strokeStyle = '#ffffff'; g.lineWidth = 7; g.shadowColor = '#ffffff'; g.shadowBlur = 22;
    rr(g, 26, 26, 1024 - 52, 420 - 52, 46); g.stroke();
    g.shadowBlur = 0; g.lineWidth = 5; g.stroke();
  } else if (kind === 'pool') {
    c.width = c.height = 256;
    const r = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    r.addColorStop(0, 'rgba(255,255,255,0.9)'); r.addColorStop(0.45, 'rgba(255,255,255,0.25)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 256, 256);
  } else if (kind === 'dot') {
    c.width = c.height = 64;
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.55, 'rgba(255,255,255,1)'); r.addColorStop(0.75, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  } else if (kind === 'spark') {
    c.width = c.height = 64;
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.25, 'rgba(255,255,255,0.8)'); r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, 64, 64);
  }
  return c;
}

// ---------------------------------------------------------------- renderer, scene, camera
const canvas = document.getElementById('scene');
const messageBox = document.getElementById('message');
function showMessage(title, text) {
  messageBox.replaceChildren(Object.assign(document.createElement('strong'), { textContent: title }), document.createTextNode(text));
  messageBox.hidden = false;
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
} catch (error) {
  showMessage('This view needs WebGL', 'The browser did not provide a WebGL context, so the scene cannot be drawn.');
  throw error;
}
renderer.setClearColor(0x000000, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.5, 900);
const shared = {
  halo: texture(glowCanvas('halo')), ring: texture(glowCanvas('ring')), pool: texture(glowCanvas('pool')),
  dot: texture(glowCanvas('dot')), spark: texture(glowCanvas('spark')),
};

// ---------------------------------------------------------------- pan & zoom control (always horizontally level, no rotation)
const SLOPE = V(0, LANE.rise, -LANE.depth).normalize();
class Orbit {

    this.sph = new THREE.Spherical(40, 1.0, 0); this.goal = new THREE.Spherical(40, 1.0, 0);
    this.pointers = new Map(); this.moved = 0; this.onClick = null; this.onHover = null;
    dom.addEventListener('pointerdown', e => this.down(e));
    dom.addEventListener('pointermove', e => this.move(e));
    dom.addEventListener('pointerup', e => this.up(e));
    dom.addEventListener('pointercancel', e => { this.pointers.delete(e.pointerId); if (!this.pointers.size) dom.classList.remove('dragging'); });
    dom.addEventListener('pointerleave', () => this.onHover?.(null));
    dom.addEventListener('wheel', e => { e.preventDefault(); this.zoom(Math.exp(e.deltaY * 0.0011)); }, { passive: false });
    dom.addEventListener('contextmenu', e => e.preventDefault());
    dom.addEventListener('keydown', e => this.key(e));
  }
  set(target, radius, phi = 1.0, _theta = 0, now = false) {
    this.goalTarget.copy(target); this.goal.set(radius, phi, 0);
    if (now) { this.target.copy(target); this.sph.set(radius, phi, 0); }
  }
  zoom(f) { this.goal.radius = THREE.MathUtils.clamp(this.goal.radius * f, 8, 420); this.onInput?.(); }
  pan(dx, dy) {
    this.onInput?.();
    const px = (2 * this.sph.radius * Math.tan(THREE.MathUtils.degToRad(this.cam.fov) / 2)) / Math.max(innerHeight, 320);
    const up = V(0, 1, 0).applyQuaternion(this.cam.quaternion);
    const slopeProj = Math.max(0.25, SLOPE.dot(up));

    p.x = e.clientX; p.y = e.clientY;

// ---------------------------------------------------------------- the model: graph + state from the snapshot
function buildModel(view) {
  const whole = view.graph;
  STAGED = whole.tracks.some(t => t.id === 'board') ? 'board' : (whole.nodes.find(n => n.stage)?.track || 'board');
  setHues(whole.tracks);
  // Every card on every track, for a name or a state the page needs from a track it does not draw.
  const all = new Map(whole.nodes.map(n => [n.id, { ...n, ...view.state.nodes[n.id] }]));
  // With no track named: the board's, or in a graph with no board, the first track that has cards.
  const first = whole.tracks.some(t => t.id === STAGED) ? STAGED
    : (whole.tracks.find(t => whole.nodes.some(n => n.track === t.id))?.id || 'board');
  MAIN = TRACK && whole.nodes.some(n => n.track === TRACK) ? TRACK : first;
  const g = MAIN === STAGED ? whole : trackGraph(whole, MAIN);
  if (MAIN !== STAGED && view.log) {
    // A track's page keeps the updates on its own cards.
    const rows = view.log.rows.filter(r => g.nodes.some(n => n.id === r.node));
    view = { ...view, log: { ...view.log, rows, total: rows.length } };
  }
  const nodes = new Map(g.nodes.map(n => [n.id, { ...n, ...view.state.nodes[n.id] }]));
  const tracks = view.state.tracks;
  const next = new Map();
  for (const t of g.tracks) {

    if (!pos || pos === 'done') continue;
    const n = nodes.get(pos);
    if (!n) continue;
    if (n.outcomes.pass !== 'done') next.set(n.outcomes.pass, 'pass');
    for (const r of n.outcomes.returned) if (!next.has(r)) next.set(r, 'returned');
  }
  const stageIndex = new Map(g.stages.map((s, i) => [s.id, i]));
  const stageStatus = new Map(g.stages.map(s => {
    const ids = g.nodes.filter(n => n.stage === s.id).map(n => nodes.get(n.id).status);
    return [s.id, ids.includes('current') ? 'current' : ids.every(x => x === 'passed') ? 'passed' : 'ahead'];
  }));
  const issues = id => g.open_issues.filter(i => i.close_before.includes(id));
  const whereTracks = Object.fromEntries(view.where.tracks.map(t => [t.id, t]));
  return { view, g, whole, all, nodes, tracks, next, stageIndex, stageStatus, issues, whereTracks, prs: pullRequests(view.workspace) };

// Pull requests beside the graph: GitHub's open ones, each tied to the node whose record names it, and the one a
// position waits on (open or merged). Git never becomes a node or an edge; this is information on the page.
function pullRequests(ws) {
  const byNumber = new Map();
  for (const pr of ws?.pull_requests?.open || []) byNumber.set(pr.number, { ...pr, state: 'open' });
  for (const q of ws?.merge_questions || []) {
    const pr = byNumber.get(q.pull_request) || { number: q.pull_request, title: null, branch: null, record: null };
    Object.assign(pr, {
      question: q, node: q.node, named_in: 'inputs', state: q.state || pr.state || 'unknown',
      url: pr.url || q.url, draft: q.draft ?? pr.draft, checks: q.checks ?? pr.checks,
    });
    byNumber.set(q.pull_request, pr);
  }
  const list = [...byNumber.values()].sort((a, b) => a.number - b.number);
  const byNode = new Map();
  for (const pr of list) if (pr.node) byNode.set(pr.node, [...(byNode.get(pr.node) || []), pr]);
  // Where each open pull request's branch stands by its own records, the ones main lacks: the cards it passed
  // there and the card it stands at. Main's cards do not move for it; the page says it beside them.
  const ahead = new Map();
  const add = (id, pr, how) => ahead.set(id, [...(ahead.get(id) || []), { pr, how }]);
  for (const pr of list) for (const t of pr.on_branch || []) {
    for (const id of t.passed) add(id, pr, 'passed');
    if (t.position && t.position !== 'done') add(t.position, pr, 'at');

function build(model) {
  clearWorld();

  // Board lanes: one terrace per stage, a row of cards on each.

    const base = laneBase(i);

    slab(LANE_LEFT, LANE_RIGHT, base, status === 'current' ? S.floorLit : status === 'passed' ? S.floor : '#080808',
      status === 'current' ? S.glow : status === 'passed' ? S.dim : '#1c1c1b');
    const numColor = status === 'current' ? S.bright : status === 'passed' ? S.glow : '#77756f';
    const textColor = status === 'current' ? INK.primary : status === 'passed' ? INK.secondary : '#a3a29b';
    const spot = place(base, LANE_LEFT + 0.35 + STAGE_LABEL_W / 2, 1);

      { text: stage.label, size: 90, weight: 600, display: true, color: stage.row ? numColor : textColor },
    ], STAGE_LABEL_W, CARD.h, spot.center, 240);

    const left = s.x - CARD.w * s.scale / 2;

    slab(left - 0.7, left + span + s.tail, s.lane, started ? S.floorLit : S.floor, S.dim, 0.3);
    ids.forEach((id, j) => addCard(id, s.track, place(s.lane, s.x + j * s.pitch, s.scale)));
    const label = g.tracks.find(t => t.id === s.track).label;
    const cut = label.indexOf(' (');
    const head = cut > 0 ? label.slice(0, cut) : label, rest = cut > 0 ? label.slice(cut + 1) : '';

    const first = P.get(ids[0]);

    const hc = first.top.clone().addScaledVector(UP, hh / 2 + 0.08).add(V(hw / 2 - first.w / 2, 0, 0));
    const c = document.createElement('canvas'); c.width = hw * ppu; c.height = hh * ppu;

    hg.font = `600 84px ${FONT_DISPLAY}`; hg.fillStyle = s.list ? INK.secondary : S.bright;
    hg.fillText(head, 0, 90);
    hg.font = `400 64px ${FONT}`; hg.fillStyle = '#a3a29b';
    hg.fillText(rest.replace(/^\(|\)$/g, ''), 0, 178);

function select(id, fly = false, keepScroll = false) {

  if (fly) {

          el('span', {}, M.all.get(key)?.label || key));
      })));
  }

  if (n.requires?.length) {
    body.push(el('h3', {}, 'Depends on'), el('ul', { class: 'outcomes' }, n.requires.map(r => {
      const review = policy?.mode === 'enforce' && approvalFor(r);

      return el('li', {}, el('span', { class: 'key' }, passed ? 'Passed' : 'Waiting'), el('span', {}, nodeLink(r)));
    })));
  }

  if (n.elsewhere?.length) {
    // What this card waits on from a track this page does not draw: named, with a link to that track's page.
    body.push(el('h3', {}, 'Depends on, on another track'), el('ul', { class: 'outcomes' }, n.elsewhere.map(r => {
      const other = M.all.get(r), track = M.whole.tracks.find(t => t.id === other?.track);
      const review = policy?.mode === 'enforce' && approvalFor(r);

      return el('li', {}, el('span', { class: 'key' }, passed ? 'Passed' : 'Waiting'),
        el('span', {}, el('a', { class: 'link', href: trackHref(other?.track || STAGED) },
          `${other?.label ?? r}${track ? ` (${trackHead(track)})` : ''}`)));
    })));
  }

  const issues = M.issues(id);

    body.push(el('h3', {}, issues.length === 1 ? 'Open question before this can pass' : `${issues.length} open questions before this can pass`),
      el('div', {}, issues.map(i => el('details', { open: issues.length === 1 ? '' : null },
        el('summary', {}, i.id.replace(/_/g, ' ')), el('p', {}, cleanHumanNote(i.issue))))));

  }

  // 4. Plain-language summary of what happened last
  if (n.status === 'current') {

      body.push(el('h3', {}, 'Latest update'),
        el('p', { class: 'quiet' }, `Reached ${agoText(w.since)}${last ? ` from ${labelOf(last.node)}` : ''} (${actorHuman(w.moved_by)}).`),
        w.moved_because ? el('p', { class: 'note' }, cleanHumanNote(w.moved_because)) : null);

      n.last.note ? el('p', { class: 'note' }, cleanHumanNote(n.last.note)) : null);
    if (n.passed_before) body.push(el('p', { class: 'quiet' }, 'Passed earlier; work has since returned to an earlier step.'));
  }

  // 5. Recent human-relevant history for this card
  const rows = (M.view.log?.rows || []).filter(r => r.node === id && isHumanLogRow(r));
  if (rows.length) {
    body.push(el('h3', {}, 'History on this step'), el('ol', { class: 'log-rows' }, rows.slice(0, 5).map(rowItem)));
  }

  // 6. Tucked-away machine/agent instructions & script plumbing

  openPanel(body, `Details for ${n.label}`, { kind: 'node', id }, keepScroll);
}

// ---------------------------------------------------------------- workspace and log: what git and next are doing

  if (b && a) return `${n(b)} behind and ${n(a)} ahead of GitHub's main`;
  if (b) return `${n(b)} behind GitHub's main`;
  if (a) return `${n(a)} ahead of GitHub's main`;
  return "Level with GitHub's main";
}
function checkoutTone(c, isMain) {

  return c.behind ? 'warn' : 'ok';
}

  if (mac.this_machine) return { tone: 'ok', text: 'Mac: this machine' };
  if (!mac.reached) return { tone: 'bad', text: 'Mac: not reached' };
  if (mac.error) return { tone: 'bad', text: 'Mac: reached, status unread' };
  return null;
}
// The Mac's last keep-pace run (scripts/mac_keep_pace.py: one run each time main changes, made by the pusher, the
// sync workflow or tidy) from its status: words for the strip and a tone. Null for a read made before any run.
const KEEP_TONE = { level: 'ok', forwarded: 'good', held: 'warn', failed: 'bad' };
function keepPace(mac) {

  if (k.error) return { tone: 'bad', text: 'status unread', long: k.error };
  const tone = k.pending?.length && k.result !== 'failed' ? 'warn' : KEEP_TONE[k.result] || 'warn';

// CI's board checks as the database holds them: the validate workflow's last step on the Mac writes each run's

function ciTone(ci) {

  return ci.passed ? (ci.open ? 'warn' : 'ok') : 'bad';
}

  return `${ci.passed ? 'pass' : 'FAIL'}${open} ${hhmm(ci.at)}`;

  const failing = (ci.checks || []).filter(c => !c.ok).map(c => c.check);
  return `${ci.passed ? 'pass' : 'FAIL'}, ${ci.open ?? '?'} open${failing.length ? `; failing: ${failing.join(', ')}` : ''}; run ${ci.run_id} (${ci.event}) at ${when(ci.at)}`;

function chip(key, tone, parts, onclick, label) {

}
// Between full snapshots the workspace is carried (git, the Mac, GitHub) and only the database's part is new.
const carried = ws => ws?.quick ? { from: ws.quick.carried_from } : null;
function renderWorkspace(before) {
  const strip = $('strip'), ws = M.view.workspace, kept = carried(ws);
  const asof = kept?.from ? `as of ${hhmm(kept.from)}` : null;
  const items = [el('span', { class: 'strip-title' }, 'Status', asof ? el('span', { class: 'asof' }, asof) : null)];
  const open = () => openWorkspace();
  // Who is working which node now, from the database: first, since it is what is happening.
  for (const n of M.nodes.values()) {
    if (!n.attempt) continue;
    items.push(chip(`work-${n.id}`, 'good', [el('span', { class: 'k' }, 'Working'), el('b', {}, n.label),
      `${actorHuman(n.attempt.by)} (${agoText(n.attempt.since)})`], () => select(n.id, true),
      `Working: ${n.attempt.by} on ${n.label}, since ${when(n.attempt.since)}`));
  }
  if (!ws) {
    items.push(privateHidden
      ? chip('none', 'ok', ['Private details hidden'], open, 'Workspace: hidden with the private details')
      : chip('none', 'bad', ['Not in this snapshot'], open, 'Workspace: not in this snapshot'));
    strip.replaceChildren(...items);
    return;
  }
  const unread = kept && !kept.from;
  if (ws.error) items.push(chip('error', 'bad', [el('span', { class: 'k' }, 'Workspace'), 'not read'], open, 'Workspace: not read'));
  const alone = !!M?.view?.one_machine;  // the project runs on one machine: there is no Mac to report
  if (unread) items.push(chip('unread', 'warn', [alone ? 'Git & GitHub not read yet' : 'Git, Mac & GitHub not read yet'], open,
    alone ? 'Workspace: git and GitHub not read yet' : 'Workspace: git, the Mac and GitHub not read yet'));

  // Collapse routine git/Mac/tidy/fetch plumbing into one quiet pill when healthy; surface alerts individually.
  const alerts = [];
  for (const c of ws.here?.checkouts || []) {
    const isMain = c.branch === 'main';
    const tone = checkoutTone(c, isMain);
    if (tone !== 'ok' || !isMain) {
      const k = isMain ? 'Local' : 'Branch';
      alerts.push(chip(isMain ? 'main' : 'this', tone, [el('span', { class: 'k' }, k), el('b', {}, c.branch || 'detached'),
        standing(c)], open, `${k}: ${c.branch} at ${c.head}, ${standingLong(c)}`));
    }
  }
  const mac = alone ? null : ws.mac, word = ws.error || unread || alone ? null : macWord(mac);
  if (word && word.tone !== 'ok') alerts.push(chip('mac', word.tone, [word.text], open, word.text));

    if (macTone !== 'ok') alerts.push(chip('mac', macTone, [el('span', { class: 'k' }, 'Mac'), el('b', {}, mac.branch), standing(mac)], open, `Mac: ${standingLong(mac)}`));
    const kp = keepPace(mac);
    if (kp && (kp.tone === 'bad' || kp.stopped)) alerts.push(chip('keep-pace', kp.tone, [el('span', { class: 'k' }, 'Mac sync'), kp.stopped ? 'stopped?' : kp.text], open, `Mac keep-pace: ${kp.text}`));
  }

  }
  if (ws.fetch_error) alerts.push(chip('github', 'bad', [el('span', { class: 'k' }, 'GitHub'), 'fetch failed'], open, 'GitHub: fetch failed'));

  if (!ws.error && !unread) {

    const where = pr.node ? labelOf(pr.node) : onBranch.length ? onBranch[0] : 'no node';
    const card = pr.node && M.nodes.has(pr.node) ? pr.node : stands;

      () => card ? select(card, true) : openWorkspace(),
      `Pull request ${pr.number}: ${prState(pr)}, ${pr.node ? `named in a record at ${labelOf(pr.node)}` : 'no record names it'}`

  }
  if (ws.pull_requests?.error) items.push(chip('pr-error', 'bad', ['Pull requests: unread'], open, 'Pull requests: GitHub did not say'));

  strip.replaceChildren(...items);
  flashChanged('strip', before);

    list.hidden = true;
    const singleNeed = ownerNeedFromView(M?.view, null, true);
    renderNeedsYou(singleNeed ? [singleNeed] : []);
    fitLog();
    return;
  }
  list.hidden = false;
  const turn = ++boardsRead;
  const rows = await Promise.all(all.map(async b => {
    const isShown = (b.data || '') === DATA;
    let bView = isShown ? M.view : null;
    if (!isShown && location.protocol.startsWith('http')) {
      try {
        const r = await fetch((b.data || '') + 'view.json', { cache: 'no-store' });
        if (r.ok) bView = shown(await r.json());
      } catch { /* that board has no view yet, or it was caught mid-write: the next change brings it */ }
    }
    const stands = bView ? boardStands(bView) : null;
    const need = bView ? ownerNeedFromView(bView, b.name, isShown) : null;
    if (need) need.data = b.data;
    return { b, shown: isShown, stands, need };
  }));
  if (turn !== boardsRead) return;  // a newer snapshot is being drawn
  list.replaceChildren(...rows.map(({ b, shown, stands, need }) => el('li', {},
    el('a', {
      href: b.data ? `?board=${b.name}` : location.pathname,
      class: need ? 'needs-owner' : '',
      ...(shown ? { 'aria-current': 'page' } : {}),
    },
      el('span', { class: 'name' }, b.title || b.name),
      stands ? el('span', { class: 'at' }, stands) : null))));
  renderNeedsYou(rows.map(r => r.need).filter(Boolean));
  fitLog();
}
function showTitle() {
  const title = titleText();
  document.title = title;
  $('title').textContent = title;
  $('scene').setAttribute('aria-label', `The ${M?.view?.project ? M.view.project + ' ' : ''}${graphKind()} in 3D. Use the track positions at the top left or All nodes for a list.`);
}

// A new snapshot redraws the scene, the positions, the log and the workspace, and the panel shows what it showed.
// With `play` (the server told the page while it is in view), the difference plays as it lands.
// Hide private: the page is drawn from a copy of the snapshot with the private details taken out, so nothing on
// it, the 3D labels, the lists, the panel text or a Save PNG picture, holds them while the flag is on; nothing is
// covered. What is taken out: the workspace block whole (machines, accounts, paths, links, branches), and in every
// other string: links, local paths, commit hashes, and the machine and account names. The names come with the
// snapshot (`private_names`: the site settings' SSH user and host, and the names the machines that wrote it gave),
// so the page itself names no machine; the list goes too. `source` (the graph file's name and hash) and every `id`
// stay, because the page compares them and shows neither.
const PRIVATE = [
  [/https?:\/\/\S+/g, '[link hidden]'],
  [/[A-Za-z]:\\[^\s"'<>]+/g, '[path hidden]'],
  [/\/(?:Users|home)\/[^\s"'<>]+/g, '[path hidden]'],
  [/\b[0-9a-f]{7,40}\b/g, '[commit hidden]'],
];
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function privatePatterns(view) {
  const names = [...new Set((view?.private_names || []).filter(n => typeof n === 'string' && n.trim()))]
    .sort((a, b) => b.length - a.length).map(escapeRe);
  if (!names.length) return PRIVATE;
  // A name is a whole word: not inside a longer name or word. The character before it is kept.
  return [...PRIVATE, [new RegExp(`(^|[^A-Za-z0-9_])(?:${names.join('|')})(?![A-Za-z0-9_])`, 'gi'), '$1[name hidden]']];
}
let privateHidden = false, fullView = null;
function hidePrivate(value, patterns = privatePatterns(value)) {
  if (typeof value === 'string') return patterns.reduce((s, [re, to]) => s.replace(re, to), value);
  if (Array.isArray(value)) return value.map(v => hidePrivate(v, patterns));
  if (value && typeof value === 'object') {
    const out = {};
    for (const [k, v] of Object.entries(value)) {
      out[k] = k === 'workspace' || k === 'private_names' ? null : (k === 'source' || k === 'id') ? v : hidePrivate(v, patterns);
    }
    return out;
  }
  return value;
}
const shown = view => privateHidden ? hidePrivate(view) : view;
$('private').addEventListener('click', () => {
  privateHidden = !privateHidden;
  const b = $('private');
  b.setAttribute('aria-pressed', String(privateHidden));
  b.textContent = privateHidden ? 'Show private' : 'Hide private';
  document.documentElement.dataset.private = privateHidden ? 'hidden' : 'shown';
  if (fullView) apply(shown(fullView));
});

function apply(view, play = false) {
  const mode = panelMode, prev = play ? M : null;
  const before = prev ? { positions: texts('positions'), strip: texts('strip') } : {};
  build(buildModel(view));
  showTitle();
  renderTabs();
  tintLegend();
  renderBoards();
  rowNews = prev ? rowChanges(prev.view.log?.rows || [], M.view.log?.rows || []) : new Map();
  renderPositions(before.positions);
  renderLog();
  renderWorkspace(before.strip);
  defaultView = computeDefaultView();  // whether the log holds the left column is known once it is fitted
  if (!mode) applyHighlight();
  else if (mode.kind === 'node' && M.nodes.has(mode.id)) select(mode.id, false, true);
  else if (mode.kind === 'list') openList();
  else if (mode.kind === 'log') openLog(true);
  else if (mode.kind === 'workspace') openWorkspace();
  else if (mode.kind === 'row') {
    const row = (M.view.log?.rows || []).find(r => r.id === mode.id);
    if (row) openLogRow(row, true); else openLog();
  } else closePanel();
  rowNews = new Map();
  if (prev && prev.view.source?.graph_sha256 === view.source?.graph_sha256) startShow(prev);
  // Hand the new cards to the GPU now, so the first frames of the show do not stall on them.
  for (const d of disposables) if (d.isTexture) renderer.initTexture(d);
}

resize();
const loaded = await loadView();
if (!loaded) {
  showMessage('No snapshot to show', 'Run py -3 scripts/board_graph_view.py snapshot, then open this page again.');
} else {
  fullView = loaded.view;
  apply(shown(fullView));
  resetView(true);
  document.documentElement.dataset.source = loaded.from;
  requestAnimationFrame(frame);
  // Served over http, the page never asks whether something changed: it is told. It holds the server's /events
  // stream (scripts/board_graph_serve.py), which sends the files' stamps when it opens and again each time the Mac
  // says the folder changed: every write of view.json and every fast-forward of main say so. A page stamp other
  // than the one this page was served with means index.html itself changed on main, so the page reloads; otherwise
  // view.json is read again and a difference plays as it lands. The browser reopens a dropped stream by itself,
  // and the stamp line says while it is down.
  if (location.protocol.startsWith('http')) {
    let last = loaded.text, reading = false, again = false;
    const live = $('live');
    live.hidden = false;
    const setLive = (on) => {
      live.textContent = on ? 'Live: told of every change' : 'Not connected: reconnecting';
      live.classList.toggle('off', !on);
      document.documentElement.dataset.live = on ? 'yes' : 'no';
    };
    setLive(false);
    const servedWith = fetch('index.html', { method: 'HEAD', cache: 'no-store' })
      .then(r => Math.floor(Date.parse(r.headers.get('Last-Modified')) / 1000))
      .catch(() => null);
    async function readView() {
      if (reading) { again = true; return; }
      reading = true;
      let text = null, view = null;
      try {
        const r = await fetch(DATA + 'view.json', { cache: 'no-store' });
        if (r.ok) text = await r.text();
        if (text && text !== last) view = JSON.parse(text);
      } catch { /* the server stopped between the event and the read: the next event brings it */ }
      reading = false;
      if (view) {
        last = text;
        fullView = view;
        document.documentElement.dataset.source = 'view.json';
        apply(shown(view), !document.hidden);
      } else renderBoards();  // this board's view is as it was: the change may be another board's position
      if (again) { again = false; readView(); }
    }
    const events = new EventSource('events');
    events.onopen = () => setLive(true);
    events.onerror = () => setLive(false);
    events.onmessage = async (e) => {
      const stamps = JSON.parse(e.data);
      const mine = await servedWith;
      if (mine !== null && stamps.page !== mine) { location.reload(); return; }
      readView();
    };
  }
}
</script>
</body>
</html>
