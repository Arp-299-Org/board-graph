<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #08090c;
    --surface: #111318;
    --surface-2: #171b24;
    --surface-hover: #1d222e;
    --ink-1: #f2f1ed;
    --ink-2: #c2c1b8;
    --ink-3: #85847c;
    --hair: rgba(255, 255, 255, 0.10);
    --hair-strong: rgba(255, 255, 255, 0.18);
    --blue: #3987e5;
    --blue-bg: rgba(57, 135, 229, 0.14);
    --blue-soft: #86b6ef;
    --amber: #e2a336;
    --amber-bg: rgba(226, 163, 54, 0.14);
    --red: #e5534b;
    --red-bg: rgba(229, 83, 75, 0.15);
    --green: #3fb950;
    --green-bg: rgba(63, 185, 80, 0.14);
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink-1); font: 400 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--blue-soft); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  code, pre { font-family: var(--mono); }

  .app { min-height: 100%; display: flex; flex-direction: column; }
  .header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--hair); background: var(--surface);
    position: sticky; top: 0; z-index: 20;
  }
  .title-block { display: flex; flex-direction: column; gap: 2px; min-width: 220px; }
  .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .milestone { color: var(--ink-3); font-size: 12.5px; }

  .pills { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--hair); background: var(--surface-2); font-size: 12px; color: var(--ink-2);
  }
  .pill.auto { border-color: rgba(134, 182, 239, 0.4); color: var(--blue-soft); background: var(--blue-bg); }
  .pill.tool { cursor: pointer; font-family: var(--mono); font-size: 11.5px; }
  .pill.tool:hover { background: var(--surface-hover); border-color: var(--hair-strong); }
  .pill.dirty { border-color: rgba(226, 163, 54, 0.45); color: var(--amber); background: var(--amber-bg); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
  .dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.stale { background: var(--amber); }

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .btn {
    padding: 6px 11px; border: 1px solid var(--hair); border-radius: 6px;
    background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; font-weight: 500;
  }
  .btn:hover { background: var(--surface-hover); color: var(--ink-1); border-color: var(--hair-strong); }
  .btn.active { border-color: var(--blue); color: var(--ink-1); background: var(--blue-bg); }
  select.board-select {
    background: var(--surface-2); color: var(--ink-1); border: 1px solid var(--hair);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12.5px;
  }

  .status-strip {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 20px; border-bottom: 1px solid var(--hair); background: #0c0e13; font-size: 12.5px; color: var(--ink-2);
  }
  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; color: var(--ink-3); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid transparent; }

  .main { flex: 1; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 22px; }
  .board-scroll { overflow-x: auto; padding-bottom: 6px; }
  .stages { display: flex; align-items: flex-start; gap: 12px; min-width: max-content; }
  .stage-col {
    width: 224px; flex: 0 0 224px; background: var(--surface); border: 1px solid var(--hair);
    border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .stage-col.current { border-color: rgba(134, 182, 239, 0.45); }
  .stage-head {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding-bottom: 6px; border-bottom: 1px solid var(--hair); font-size: 12px; font-weight: 600; color: var(--ink-2);
  }
  .stage-count { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }

  .card {
    text-align: left; width: 100%; border-radius: 8px; padding: 9px 10px;
    border: 1px solid var(--hair); background: var(--surface-2);
    display: flex; flex-direction: column; gap: 5px; transition: border-color .12s, background .12s;
  }
  .card:hover { background: var(--surface-hover); border-color: var(--hair-strong); }
  .card.selected { outline: 2px solid var(--blue-soft); outline-offset: 1px; }
  .card.passed { border-color: rgba(57, 135, 229, 0.55); background: rgba(28, 92, 171, 0.16); }
  .card.current { border-color: rgba(134, 182, 239, 0.85); background: rgba(134, 182, 239, 0.13); }
  .card.blocked-owner { border-color: rgba(226, 163, 54, 0.8); background: var(--amber-bg); }
  .card.blocked-lead { border-color: rgba(229, 83, 75, 0.85); background: var(--red-bg); }
  .card.ahead { opacity: 0.78; }
  .card.returned-before { border-style: dashed; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .card-title { font-weight: 600; font-size: 13px; color: var(--ink-1); line-height: 1.3; }
  .badge {
    flex: none; padding: 1px 6px; border-radius: 4px; font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.03em; border: 1px solid var(--hair); color: var(--ink-3);
  }
  .badge.passed { color: var(--blue-soft); border-color: rgba(57, 135, 229, 0.5); }
  .badge.working { color: #9ecaff; border-color: rgba(134, 182, 239, 0.6); }
  .badge.owner { color: var(--amber); border-color: rgba(226, 163, 54, 0.55); }
  .badge.lead { color: var(--red); border-color: rgba(229, 83, 75, 0.55); }
  .badge.ready { color: var(--green); border-color: rgba(63, 185, 80, 0.5); }
  .card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
  .card-note { font-size: 11.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }

  .side-tracks { display: flex; flex-direction: column; gap: 12px; }
  .track-box { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 12px; }
  .track-box h2 { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .wrap-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

  .popover {
    position: fixed; top: 56px; right: 20px; width: min(460px, calc(100vw - 40px));
    background: var(--surface); border: 1px solid var(--hair-strong); border-radius: 10px;
    padding: 14px; box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6); z-index: 40; display: none;
  }
  .popover.open { display: block; }
  .popover h3 { margin: 0 0 8px; font-size: 14px; }
  .commit-list { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 12px; }
  .commit-list li { display: flex; gap: 8px; color: var(--ink-2); }
  .commit-list code { color: var(--blue-soft); flex: none; }

  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); z-index: 30; display: none;
  }
  .drawer-backdrop.open { display: block; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw);
    background: var(--surface); border-left: 1px solid var(--hair-strong); z-index: 35;
    display: flex; flex-direction: column; transform: translateX(100%); transition: transform .15s ease-out;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--hair);
  }
  .drawer-head h2 { margin: 0; font-size: 16px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 14px; }
  .sec h4 { margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-3); }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; font-size: 12.5px; }
  .kv .k { color: var(--ink-3); }
  .note-box {
    margin: 0; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--hair);
    background: #0c0e13; color: var(--ink-1); font-size: 12px; white-space: pre-wrap; word-break: break-word; line-height: 1.45;
  }
  .list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
  .list li { padding: 5px 8px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--hair); word-break: break-word; }
  .thumb { max-width: 100%; border-radius: 6px; border: 1px solid var(--hair); margin-top: 6px; display: block; }
  .error-banner { margin: 16px 20px; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--red); background: var(--red-bg); color: var(--ink-1); }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="title-block">
      <div class="title-row">
        <h1 id="proj-title">Graph</h1>
        <span id="autonomy-pill" class="pill auto" style="display:none"></span>
        <button id="tool-pill" class="pill tool" style="display:none" title="Click to view tool commits ahead of main"></button>
      </div>
      <div class="milestone" id="milestone">Loading...</div>
    </div>
    <div class="actions">
      <div id="tabs" style="display:flex;gap:6px"></div>
      <select id="board-select" class="board-select" style="display:none" aria-label="Select board"></select>
      <span class="pill" id="live-pill"><span id="live-dot" class="dot"></span><span id="live-text">Connecting</span></span>
      <button class="btn" id="btn-log">Activity Log</button>
      <button class="btn" id="btn-notes" style="display:none">Notes</button>
      <a class="btn" id="btn-files" href="/files/" target="_blank" rel="noopener">Files</a>
    </div>
  </header>

  <div class="status-strip">
    <div id="position-line">Loading track position...</div>
    <div class="legend">
      <span><i class="swatch" style="background:rgba(28,92,171,0.45);border-color:#3987e5"></i>Passed</span>
      <span><i class="swatch" style="background:rgba(134,182,239,0.28);border-color:#86b6ef"></i>Current / Working</span>
      <span><i class="swatch" style="background:var(--amber-bg);border-color:var(--amber)"></i>Needs you</span>
      <span><i class="swatch" style="background:var(--red-bg);border-color:var(--red)"></i>Needs lead</span>
      <span><i class="swatch" style="background:var(--surface-2);border-color:var(--hair)"></i>Ahead</span>
    </div>
  </div>

  <div id="error-box"></div>

  <main class="main">
    <div class="board-scroll">
      <div class="stages" id="stages"></div>
    </div>
    <div class="side-tracks" id="side-tracks"></div>
  </main>
</div>

<div class="popover" id="tool-popover">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h3 id="tool-pop-title">board-graph tool</h3>
    <button class="btn" id="tool-pop-close">Close</button>
  </div>
  <div id="tool-pop-body" style="font-size:12.5px;color:var(--ink-2)"></div>
</div>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <h2 id="drawer-title">Details</h2>
    <button class="btn" id="drawer-close">Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<script>
(() => {
  const PATH_MASKS = [
    [/[A-Za-z]:\\[^\s"'<>]+/g, '[path hidden]'],
    [/\/(?:Users|home)\/[^\s"'<>]+/g, '[path hidden]'],
  ];
  function cleanText(raw) {
    let text = String(raw ?? '');
    for (const [re, rep] of PATH_MASKS) text = text.replace(re, rep);
    const priv = (currentView && Array.isArray(currentView.private_names)) ? currentView.private_names : [];
    for (const name of priv) {
      if (name && name.length > 1) text = text.split(name).join('[redacted]');
    }
    return text;
  }
  const esc = (s) => cleanText(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const params = new URLSearchParams(location.search);
  let activeBoard = params.get('board') || null;
  let activeTrack = params.get('track') || null;
  let currentView = null;
  let selectedCard = null;
  let drawerMode = null; // 'card' | 'log' | 'notes'
  let pageStamp = null;

  const $ = (id) => document.getElementById(id);

  function mainTrackId(view) {
    const tracks = (view.graph && view.graph.tracks) || [];
    if (activeTrack && tracks.some((t) => t.id === activeTrack)) return activeTrack;
    const ordered = tracks.find((t) => t.ordered);
    return (ordered && ordered.id) || (tracks[0] && tracks[0].id) || 'board';
  }

  function viewJsonUrl() {
    if (activeBoard && currentView && Array.isArray(currentView.boards)) {
      const b = currentView.boards.find((item) => item.name === activeBoard && !item.first);
      if (b) return `boards/${encodeURIComponent(b.name)}/view.json`;
    }
    return 'view.json';
  }

  function fileHref(rel) {
    const clean = String(rel || '').replace(/^\/+/, '');
    const suffix = activeBoard ? `?board=${encodeURIComponent(activeBoard)}` : '';
    return `/files/${clean.split('/').map(encodeURIComponent).join('/')}${suffix}`;
  }

  function formatAgo(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return iso;
    const sec = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
    if (sec < 60) return `${sec}s ago`;
    if (sec < 3600) return `${Math.floor(sec / 60)}m ago`;
    return `${Math.floor(sec / 3600)}h ago`;
  }

  function cardStatus(node, st, trackPos) {
    const attempt = st && st.attempt;
    const last = st && st.last;
    const outcome = last && last.outcome;
    if (st && st.status === 'passed') return { cls: 'passed', badgeCls: 'passed', badge: 'Passed' };
    if (st && st.status === 'current') {
      if (attempt) return { cls: 'current', badgeCls: 'working', badge: 'Working' };
      if (outcome === 'needs_owner') return { cls: 'blocked-owner', badgeCls: 'owner', badge: 'Needs you' };
      if (outcome === 'needs_lead' || outcome === 'needs_skill') {
        return { cls: 'blocked-lead', badgeCls: 'lead', badge: outcome === 'needs_skill' ? 'Needs skill' : 'Needs lead' };
      }
      return { cls: 'current', badgeCls: 'ready', badge: trackPos === node.id ? 'Current' : 'Next' };
    }
    if (st && st.status === 'open') return { cls: 'current', badgeCls: 'working', badge: 'Open' };
    return { cls: 'ahead' + (st && st.passed_before ? ' returned-before' : ''), badgeCls: '', badge: node.who || 'ahead' };
  }

  function renderHeader(view) {
    const title = view.project || 'Graph';
    const mainTrack = mainTrackId(view);
    document.title = `${title} graph`;
    $('proj-title').textContent = title;
    $('milestone').textContent = view.milestone || (view.graph && view.graph.milestone) || '';

    const tracks = (view.graph && view.graph.tracks) || [];
    const tabsEl = $('tabs');
    if (tracks.length > 1) {
      tabsEl.innerHTML = tracks.map((t) =>
        `<button class="btn${t.id === mainTrack ? ' active' : ''}" data-track="${esc(t.id)}">${esc(t.label || t.id)}</button>`
      ).join('');
      tabsEl.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
        activeTrack = b.dataset.track;
        renderBoard(currentView);
      }));
    } else {
      tabsEl.innerHTML = '';
    }

    const auto = view.autonomy;
    const autoEl = $('autonomy-pill');
    if (auto && auto.mode === 'delegated') {
      autoEl.style.display = 'inline-flex';
      autoEl.textContent = `AUTONOMOUS <= ${auto.until || 'quote_files'}`;
    } else {
      autoEl.style.display = 'none';
    }

    const tool = view.tool;
    const toolEl = $('tool-pill');
    if (tool) {
      toolEl.style.display = 'inline-flex';
      const bits = [];
      if (tool.version) bits.push(`v${tool.version}`);
      if (tool.branch) bits.push(tool.branch);
      if (tool.commit) bits.push(`@${tool.commit}`);
      if (tool.ahead > 0) bits.push(`+${tool.ahead}`);
      if (tool.dirty) bits.push('dirty');
      toolEl.className = 'pill tool' + (tool.dirty || tool.ahead > 0 ? ' dirty' : '');
      toolEl.textContent = `tool: ${bits.join(' ')}`;
    } else {
      toolEl.style.display = 'none';
    }

    const sel = $('board-select');
    if (Array.isArray(view.boards) && view.boards.length > 1) {
      sel.style.display = 'inline-block';
      sel.innerHTML = view.boards.map((b) =>
        `<option value="${esc(b.name)}"${b.name === (activeBoard || view.board) ? ' selected' : ''}>${esc(b.name)}</option>`
      ).join('');
    } else {
      sel.style.display = 'none';
    }

    $('btn-notes').style.display = view.notes ? 'inline-block' : 'none';
    const boardTrack = ((view.where && view.where.tracks) || []).find((t) => t.id === 'board') || {};
    const pos = boardTrack.position || (view.state && view.state.tracks && view.state.tracks.board && view.state.tracks.board.position) || 'done';
    const transitions = boardTrack.transitions || [];
    const last = transitions[transitions.length - 1];
    $('position-line').innerHTML = last
      ? `Position: <code>${esc(pos)}</code> &middot; Last: <strong>${esc(last.node)}</strong> <code>${esc(last.outcome)}</code> &rarr; <code>${esc(last.target)}</code> (${esc(last.actor)}, ${esc(formatAgo(last.at))})`
      : `Position: <code>${esc(pos)}</code> &middot; Waiting for first transition`;
  }

  function makeCardEl(node, st, art, issues, trackPos) {
    const info = cardStatus(node, st, trackPos);
    const btn = document.createElement('button');
    btn.className = `card ${info.cls}${selectedCard === node.id ? ' selected' : ''}`;
    btn.type = 'button';
    const badgeText = (art && art.badge) ? `<span>${esc(art.badge)}</span>` : '';
    const issueBadge = issues.length ? `<span style="color:var(--amber)">${issues.length} issue${issues.length > 1 ? 's' : ''}</span>` : '';
    const actorLine = st && st.attempt ? `working: ${st.attempt.by}` : (st && st.last ? `${st.last.outcome} by ${st.last.actor}` : node.who);
    const noteText = (st && st.attempt && st.attempt.note) || (st && st.last && st.last.note) || '';
    btn.innerHTML = `
      <div class="card-top">
        <span class="card-title">${esc(node.label || node.id)}</span>
        <span class="badge ${info.badgeCls}">${esc(info.badge)}</span>
      </div>
      <div class="card-meta"><span>${esc(actorLine)}</span>${badgeText}${issueBadge}</div>
      ${noteText ? `<div class="card-note">${esc(noteText)}</div>` : ''}
    `;
    btn.addEventListener('click', () => openCard(node.id));
    return btn;
  }

  function renderBoard(view) {
    renderHeader(view);
    const graph = view.graph || {};
    const nodes = graph.nodes || [];
    const stages = graph.stages || [];
    const nodeStates = (view.state && view.state.nodes) || {};
    const trackStates = (view.state && view.state.tracks) || {};
    const artCards = (view.artifacts && view.artifacts.cards) || {};
    const openIssues = (graph.open_issues || []).filter((i) => !i.closed);

    const issuesByNode = {};
    for (const iss of openIssues) {
      for (const target of (iss.close_before || [])) {
        (issuesByNode[target] = issuesByNode[target] || []).push(iss);
      }
    }

    const mainTrack = mainTrackId(view);
    const boardPos = (trackStates[mainTrack] && trackStates[mainTrack].position) || null;
    const stagesEl = $('stages');
    stagesEl.innerHTML = '';

    for (const stage of stages) {
      const members = nodes.filter((n) => n.track === mainTrack && n.stage === stage.id);
      if (!members.length) continue;
      const col = document.createElement('section');
      const isCur = members.some((n) => (nodeStates[n.id] && nodeStates[n.id].status === 'current'));
      col.className = 'stage-col' + (isCur ? ' current' : '');
      const passedCount = members.filter((n) => nodeStates[n.id] && nodeStates[n.id].status === 'passed').length;
      col.innerHTML = `<div class="stage-head"><span>${esc(stage.label || stage.id)}</span><span class="stage-count">${passedCount}/${members.length}</span></div>`;
      for (const n of members) {
        col.appendChild(makeCardEl(n, nodeStates[n.id], artCards[n.id], issuesByNode[n.id] || [], boardPos));
      }
      stagesEl.appendChild(col);
    }
    const unstagedMain = nodes.filter((n) => n.track === mainTrack && !stages.some((s) => s.id === n.stage));
    if (unstagedMain.length) {
      const col = document.createElement('section');
      col.className = 'stage-col';
      col.innerHTML = `<div class="stage-head"><span>${esc(mainTrack)}</span><span class="stage-count">${unstagedMain.length}</span></div>`;
      for (const n of unstagedMain) col.appendChild(makeCardEl(n, nodeStates[n.id], artCards[n.id], issuesByNode[n.id] || [], boardPos));
      stagesEl.appendChild(col);
    }

    const sideEl = $('side-tracks');
    sideEl.innerHTML = '';
    for (const track of (graph.tracks || [])) {
      if (track.id === mainTrack) continue;
      const members = nodes.filter((n) => n.track === track.id);
      if (!members.length) continue;
      const box = document.createElement('section');
      box.className = 'track-box';
      box.innerHTML = `<h2>${esc(track.label || track.id)}</h2>`;
      const grid = document.createElement('div');
      grid.className = 'wrap-cards';
      const tpos = (trackStates[track.id] && trackStates[track.id].position) || null;
      for (const n of members) {
        grid.appendChild(makeCardEl(n, nodeStates[n.id], artCards[n.id], issuesByNode[n.id] || [], tpos));
      }
      box.appendChild(grid);
      sideEl.appendChild(box);
    }

    if (drawerMode === 'card' && selectedCard) renderCardDrawer(selectedCard);
    else if (drawerMode === 'log') renderLogDrawer();
    else if (drawerMode === 'notes') renderNotesDrawer();
  }

  function showDrawer(title, html) {
    $('drawer-title').textContent = title;
    $('drawer-body').innerHTML = html;
    $('drawer').classList.add('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    $('backdrop').classList.add('open');
  }

  function closeDrawer() {
    drawerMode = null;
    $('drawer').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'true');
    $('backdrop').classList.remove('open');
    document.querySelectorAll('.card.selected').forEach((el) => el.classList.remove('selected'));
  }

  function openCard(nodeId) {
    selectedCard = nodeId;
    drawerMode = 'card';
    renderBoard(currentView);
  }

  function renderCardDrawer(nodeId) {
    const view = currentView;
    const node = ((view.graph && view.graph.nodes) || []).find((n) => n.id === nodeId);
    if (!node) return;
    const st = (view.state && view.state.nodes && view.state.nodes[nodeId]) || {};
    const art = (view.artifacts && view.artifacts.cards && view.artifacts.cards[nodeId]) || {};
    const last = st.last;
    const attempt = st.attempt;
    const issues = ((view.graph && view.graph.open_issues) || []).filter((i) => !i.closed && (i.close_before || []).includes(nodeId));

    const parts = [];
    parts.push(`<div class="sec"><div class="kv">
      <div class="k">Card ID</div><div><code>${esc(node.id)}</code></div>
      <div class="k">Owner / Who</div><div>${esc(node.who)}</div>
      <div class="k">Status</div><div><code>${esc(st.status || 'ahead')}</code></div>
      ${node.action ? `<div class="k">Script action</div><div><code>${esc(node.action)}</code></div>` : ''}
      <div class="k">Pass -></div><div><code>${esc(node.outcomes && node.outcomes.pass)}</code></div>
      ${(node.outcomes && node.outcomes.returned && node.outcomes.returned.length) ? `<div class="k">Return -></div><div><code>${esc(node.outcomes.returned.join(', '))}</code></div>` : ''}
    </div></div>`);

    if (attempt) {
      parts.push(`<div class="sec"><h4>Active attempt</h4><pre class="note-box">${esc(attempt.by)} since ${esc(attempt.since)}\naction: ${esc(attempt.action)}\n${attempt.note || ''}</pre></div>`);
    }
    if (last) {
      parts.push(`<div class="sec"><h4>Last transition (${esc(last.outcome)} by ${esc(last.actor)})</h4><pre class="note-box">${esc(last.note || '(no note)')}</pre></div>`);
    }
    if (issues.length) {
      parts.push(`<div class="sec"><h4>Blocking open issues</h4><ul class="list">${issues.map((i) => `<li><strong>${esc(i.id)}:</strong> ${esc(i.issue)}</li>`).join('')}</ul></div>`);
    }
    if (art.items && art.items.length) {
      parts.push(`<div class="sec"><h4>Artifacts & Reports</h4><ul class="list">${art.items.map((item) => {
        const href = fileHref(item.path);
        const link = item.exists ? `<a href="${href}" target="_blank" rel="noopener">${esc(item.label || item.path)}</a>` : `${esc(item.label || item.path)} <span style="color:var(--ink-3)">(not yet)</span>`;
        const thumb = (item.exists && item.kind === 'image') ? `<a href="${href}" target="_blank" rel="noopener"><img class="thumb" src="${href}" alt="${esc(item.label)}"></a>` : '';
        return `<li>${link} <span style="color:var(--ink-3);font-size:11px;font-family:var(--mono)">${esc(item.path)}</span>${thumb}</li>`;
      }).join('')}</ul></div>`);
    }
    if (node.task) {
      parts.push(`<div class="sec"><h4>Task</h4><pre class="note-box">${esc(node.task)}</pre></div>`);
    }
    if (node.pass_when) {
      parts.push(`<div class="sec"><h4>Pass criteria</h4><pre class="note-box">${esc(node.pass_when)}</pre></div>`);
    }
    if (node.owns && node.owns.length) {
      parts.push(`<div class="sec"><h4>Owns</h4><ul class="list">${node.owns.map((p) => `<li><a href="${fileHref(p)}" target="_blank" rel="noopener"><code>${esc(p)}</code></a></li>`).join('')}</ul></div>`);
    }
    if (node.docs && node.docs.length) {
      parts.push(`<div class="sec"><h4>Docs</h4><ul class="list">${node.docs.map((p) => `<li><a href="${fileHref(p)}" target="_blank" rel="noopener"><code>${esc(p)}</code></a></li>`).join('')}</ul></div>`);
    }
    showDrawer(node.label || node.id, parts.join(''));
  }

  function renderLogDrawer() {
    drawerMode = 'log';
    const rows = (currentView && currentView.log && currentView.log.rows) || [];
    const html = rows.length
      ? `<ul class="list">${rows.map((r) => `<li><div><strong>${esc(r.kind)}</strong> <code>${esc(r.node || '')}</code> ${r.outcome ? `<code>${esc(r.outcome)}</code>` : ''} <span style="color:var(--ink-3)">${esc(r.actor || '')} &middot; ${esc(formatAgo(r.at))}</span></div>${r.note ? `<div style="color:var(--ink-2);margin-top:3px;font-size:12px">${esc(r.note)}</div>` : ''}</li>`).join('')}</ul>`
      : '<p style="color:var(--ink-3)">No activity logged yet.</p>';
    showDrawer(`Activity log (${rows.length})`, html);
  }

  function renderNotesDrawer() {
    drawerMode = 'notes';
    const n = (currentView && currentView.notes) || {};
    showDrawer(n.path || 'Notes', `<pre class="note-box">${esc(n.text || '(empty)')}</pre>`);
  }

  $('drawer-close').addEventListener('click', closeDrawer);
  $('backdrop').addEventListener('click', closeDrawer);
  $('btn-log').addEventListener('click', renderLogDrawer);
  $('btn-notes').addEventListener('click', renderNotesDrawer);
  $('board-select').addEventListener('change', (e) => {
    activeBoard = e.target.value;
    const u = new URL(location.href);
    u.searchParams.set('board', activeBoard);
    history.replaceState(null, '', u.toString());
    loadView();
  });
  $('tool-pill').addEventListener('click', () => {
    const tool = currentView && currentView.tool;
    if (!tool) return;
    const pop = $('tool-popover');
    $('tool-pop-title').textContent = `board-graph ${tool.version ? 'v' + tool.version : ''}`;
    const commits = (tool.commits_ahead || []).map((c) => `<li><code>${esc(c.sha)}</code><span>${esc(c.subject)}</span></li>`).join('');
    $('tool-pop-body').innerHTML = `
      <div>Branch: <code>${esc(tool.branch || 'detached')}</code> &middot; Commit: <code>${esc(tool.commit || '?')}</code> &middot; Dirty: <code>${tool.dirty ? 'yes' : 'no'}</code></div>
      <div style="margin-top:4px;color:var(--ink-3)">Root: <code>${esc(tool.root || '')}</code></div>
      ${commits ? `<div style="margin-top:8px;font-weight:600">Ahead of main (${tool.ahead}):</div><ul class="commit-list">${commits}</ul>` : '<div style="margin-top:8px;color:var(--ink-3)">Level with main (0 commits ahead).</div>'}
    `;
    pop.classList.toggle('open');
  });
  $('tool-pop-close').addEventListener('click', () => $('tool-popover').classList.remove('open'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeDrawer(); $('tool-popover').classList.remove('open'); } });

  async function loadView() {
    $('error-box').innerHTML = '';
    if (location.protocol === 'file:') {
      if (window.BOARD_GRAPH_SNAPSHOT) {
        currentView = window.BOARD_GRAPH_SNAPSHOT;
        $('live-text').textContent = 'Snapshot';
        renderBoard(currentView);
        return;
      }
      $('error-box').innerHTML = '<div class="error-banner">No snapshot.js data available when opened directly from disk.</div>';
      return;
    }
    try {
      const resp = await fetch(viewJsonUrl(), { cache: 'no-store' });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      currentView = await resp.json();
      if (!activeBoard && currentView.board) activeBoard = currentView.board;
      renderBoard(currentView);
    } catch (err) {
      $('error-box').innerHTML = `<div class="error-banner">Could not load ${esc(viewJsonUrl())}: ${esc(err.message)}</div>`;
    }
  }

  function connectEvents() {
    if (location.protocol === 'file:' || typeof EventSource === 'undefined') return;
    const es = new EventSource('/events');
    es.onopen = () => {
      $('live-dot').className = 'dot live';
      $('live-text').textContent = 'Live';
    };
    es.onmessage = (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        if (pageStamp !== null && msg.page && msg.page !== pageStamp) {
          location.reload();
          return;
        }
        if (msg.page) pageStamp = msg.page;
      } catch (_) {}
      loadView();
    };
    es.onerror = () => {
      $('live-dot').className = 'dot stale';
      $('live-text').textContent = 'Reconnecting';
    };
  }

  loadView();
  connectEvents();
})();
</script>
</body>
</html>
