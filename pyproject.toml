[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "board-graph"
version = "0.42.0"
description = "Shared board workflow engine and KiCad routing/validation CLI"
license = {text = "MIT"}
requires-python = ">=3.9"

[project.scripts]
board-graph = "board_graph_entry:main"

[tool.setuptools]
py-modules = ["board_graph_entry"]
